name: iOS Development Build

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:
  build-ios-dev:
    name: iOS Development Build
    needs: [get-unity-build]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Download Unity Build
        uses: actions/download-artifact@v4.1.0
        with:
          name: ios-xcode-project
          path: build/iOS
          
      - name: Development Build
        run: |
          echo "=== iOS Development Build ==="
          
          PROJECT=$(find build -name "*.xcodeproj" | head -1)
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          
          # Simple build command
          xcodebuild -project "$PROJECT" \
            -scheme Unity-iPhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES || {
              echo "Simulator build failed"
              exit 1
            }
            
          echo "✅ Development build succeeded"
          
  get-unity-build:
    name: Get Unity Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Cache Unity Library
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          
      - name: Build Unity iOS
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          buildsPath: build
          buildName: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          
      - name: Upload Build
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-xcode-project
          path: build/iOS
          retention-days: 1