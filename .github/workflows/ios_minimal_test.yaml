name: iOS Minimal Test

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

jobs:
  minimal-ios-test:
    name: Minimal iOS Build Test
    runs-on: macos-latest
    steps:
      - name: Create Test Project
        run: |
          echo "=== Creating minimal iOS test project ==="
          
          # Create simple source file
          cat > test.swift << 'EOF'
          import UIKit
          
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  return true
              }
          }
          EOF
          
          # Create Info.plist
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>TestApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.yousan</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>TestApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          
      - name: Test Build Without Signing
        run: |
          echo "=== Testing build without signing ==="
          
          # Compile Swift file
          swiftc test.swift -target arm64-apple-ios12.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -emit-executable -o TestApp || echo "Compilation failed"
            
          echo "Test completed"
          
      - name: Setup Certificates
        if: ${{ secrets.IOS_P12_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "=== Setting up certificates ==="
          
          # Import certificate
          echo "$P12_BASE64" | base64 --decode > cert.p12
          
          security create-keychain -p temp ios-build.keychain
          security default-keychain -s ios-build.keychain
          security unlock-keychain -p temp ios-build.keychain
          security set-keychain-settings -lut 21600 ios-build.keychain
          
          security import cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k ios-build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp ios-build.keychain
          
          rm cert.p12
          
          echo "=== Available certificates ==="
          security find-identity -v -p codesigning
          
      - name: Test Codesign
        if: ${{ secrets.IOS_DEVELOPMENT_TEAM != '' }}
        env:
          TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          echo "=== Testing codesign command ==="
          
          # Create a simple binary
          echo "int main() { return 0; }" > test.c
          clang test.c -o TestBinary
          
          # Try to sign it
          codesign -s "iPhone Distribution" -f TestBinary || \
          codesign -s "iPhone Developer" -f TestBinary || \
          codesign -s "-" -f TestBinary || \
          echo "Codesign failed"
          
          # Check signature
          codesign -dv TestBinary || echo "No signature"
          
      - name: Summary
        if: always()
        run: |
          echo "=== Summary ==="
          echo "1. Certificates available:"
          security find-identity -v -p codesigning | wc -l
          echo ""
          echo "2. Default keychain:"
          security default-keychain
          echo ""
          echo "3. Test completed"