name: iOS Minimal Test

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

jobs:
  test-minimal-ios:
    name: Minimal iOS Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Check Environment
        run: |
          echo "=== Environment ==="
          echo "APPLE_TEAM_ID exists: ${{ secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}"
          echo "IOS_DEVELOPMENT_TEAM exists: ${{ secrets.IOS_DEVELOPMENT_TEAM != '' && 'true' || 'false' }}"
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Xcode version: $(xcodebuild -version | head -1)"
          
      - name: Test Certificate Import
        run: |
          echo "=== Testing Certificate ==="
          if [ -z "${{ secrets.IOS_P12_BASE64 }}" ]; then
            echo "❌ IOS_P12_BASE64 is not set"
            exit 0
          fi
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 --decode > cert.p12
          
          # 簡単なキーチェーン作成
          security create-keychain -p test test.keychain
          security unlock-keychain -p test test.keychain
          security list-keychains -d user -s test.keychain
          
          # 証明書インポートを試す
          if security import cert.p12 -P "${{ secrets.IOS_P12_PASSWORD }}" -k test.keychain -T /usr/bin/codesign; then
            echo "✅ Certificate imported successfully"
            security find-identity -v -p codesigning test.keychain
          else
            echo "❌ Certificate import failed"
          fi
          
          rm cert.p12
          
      - name: Test Team ID
        run: |
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || secrets.IOS_DEVELOPMENT_TEAM }}"
          if [ -n "$TEAM_ID" ]; then
            echo "✅ Team ID is set: ${TEAM_ID:0:4}****"
          else
            echo "❌ No Team ID found"
          fi