name: iOS Ad Hoc Export

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:
  adhoc-export:
    name: Export iOS Ad Hoc
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Cache Unity Library
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            
      - name: Build Unity iOS
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          buildsPath: build
          buildName: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          
      - name: Simple Xcode Build
        run: |
          echo "=== Simple iOS Build ==="
          
          # Find project
          PROJECT=$(find build -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then
            echo "No project found"
            exit 1
          fi
          
          # Set team
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          
          # Update project
          PBXPROJ="$PROJECT/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' "$PBXPROJ"
          
          # Build
          xcodebuild -project "$PROJECT" \
            -scheme Unity-iPhone \
            -configuration Release \
            build \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO || {
              echo "Build failed, trying simulator"
              
              xcodebuild -project "$PROJECT" \
                -scheme Unity-iPhone \
                -sdk iphonesimulator \
                -configuration Release \
                build \
                CODE_SIGNING_ALLOWED=NO
            }
            
      - name: Upload Build
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-adhoc-build
          path: build/