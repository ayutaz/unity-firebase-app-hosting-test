name: iOS Fix Signing Issues

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:
  fix-ios-signing:
    name: Fix iOS Signing Step by Step
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      # Step 1: Create a simple test app
      - name: Create Test iOS App
        run: |
          echo "=== Creating simple iOS test app ==="
          
          # Create test directory
          mkdir -p TestiOSApp
          cd TestiOSApp
          
          # Create Xcode project
          cat > test.xcodeproj/project.pbxproj << 'EOF'
          // Minimal iOS project file
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 50;
            objects = {
              /* Begin PBXProject section */
              1234567890 /* Project object */ = {
                isa = PBXProject;
                attributes = {
                  LastUpgradeCheck = 1200;
                  ORGANIZATIONNAME = "Test";
                  TargetAttributes = {
                    1234567891 = {
                      CreatedOnToolsVersion = 12.0;
                    };
                  };
                };
                buildConfigurationList = 1234567892;
                mainGroup = 1234567893;
                productRefGroup = 1234567894;
                projectDirPath = "";
                projectRoot = "";
                targets = (
                  1234567891 /* TestApp */,
                );
              };
              /* End PBXProject section */
            };
            rootObject = 1234567890 /* Project object */;
          }
          EOF
          
      # Step 2: Test certificate import without Unity
      - name: Test Certificate Import
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::IOS_P12_BASE64 secret is not set"
            exit 1
          fi
          
          echo "=== Importing certificate ==="
          echo "$P12_BASE64" | base64 --decode > cert.p12
          
          # Create new keychain
          KEYCHAIN_PATH="$HOME/Library/Keychains/ios-build.keychain-db"
          KEYCHAIN_PASSWORD="temp-pwd-$(date +%s)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          security import cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          
          # Set key partition list
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Verify import
          echo "=== Imported certificates ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          
          # Get certificate common name
          CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Certificate Name: $CERT_NAME"
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
          
          rm -f cert.p12
          
      # Step 3: Test provisioning profile
      - name: Test Provisioning Profile  
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$MOBILEPROVISION_BASE64" ]; then
            echo "::error::IOS_MOBILEPROVISION_BASE64 secret is not set"
            exit 1
          fi
          
          echo "=== Testing provisioning profile ==="
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > test.mobileprovision
          
          # Decode profile
          security cms -D -i test.mobileprovision > profile.plist
          
          # Extract info
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist)
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist)
          
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile Team: $PROFILE_TEAM"
          echo "Profile App ID: $PROFILE_APP_ID"
          echo "Expected Team: $DEVELOPMENT_TEAM"
          
          # Check team match
          if [ "$PROFILE_TEAM" != "$DEVELOPMENT_TEAM" ]; then
            echo "::error::Team ID mismatch! Profile: $PROFILE_TEAM, Expected: $DEVELOPMENT_TEAM"
          fi
          
          # Check bundle ID
          if [[ "$PROFILE_APP_ID" == *"com.yousan"* ]]; then
            echo "✅ Bundle ID matches"
          else
            echo "::error::Bundle ID mismatch! Profile: $PROFILE_APP_ID, Expected: *com.yousan"
          fi
          
          # Install profile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp test.mobileprovision "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          
          rm -f test.mobileprovision profile.plist
          
      # Step 4: Download Unity build artifacts
      - name: Download Unity iOS Build
        uses: actions/download-artifact@v4.1.0
        with:
          name: ios-xcode-project
          path: build/iOS
        continue-on-error: true
        
      # Step 5: Try simplified build
      - name: Simplified iOS Build
        if: success()
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          XCODE_PROJECT=$(find build/iOS -name "*.xcodeproj" -type d | head -n 1)
          
          if [ -z "$XCODE_PROJECT" ]; then
            echo "::warning::No Xcode project found, skipping real build test"
            exit 0
          fi
          
          echo "=== Attempting simplified build ==="
          echo "Project: $XCODE_PROJECT"
          echo "Certificate: ${{ env.CERT_NAME }}"
          echo "Profile UUID: ${{ env.PROFILE_UUID }}"
          echo "Team: $DEVELOPMENT_TEAM"
          
          # Try automatic signing with explicit settings
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath archive.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="com.yousan" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates || {
              echo "=== Build failed, checking detailed error ==="
              # Try to get more specific error
              xcodebuild -project "$XCODE_PROJECT" \
                -scheme Unity-iPhone \
                -showBuildSettings | grep -E "(PRODUCT_BUNDLE|TEAM|SIGN)" | head -20
            }
          
      # Step 6: Summary
      - name: Summary
        if: always()
        run: |
          echo "=== Summary ==="
          echo "1. Certificate Import: ${{ env.CERT_NAME != '' && 'SUCCESS' || 'FAILED' }}"
          echo "2. Profile UUID: ${{ env.PROFILE_UUID != '' && env.PROFILE_UUID || 'FAILED' }}"
          echo "3. Keychain Status:"
          security list-keychains -d user
          echo "4. Installed Profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "No profiles"