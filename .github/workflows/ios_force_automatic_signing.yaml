name: iOS Force Automatic Signing

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:
  force-automatic-signing:
    name: Force Automatic Signing
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Download Unity iOS Build
        uses: actions/download-artifact@v4.1.0
        with:
          name: ios-xcode-project
          path: build/iOS
        continue-on-error: true
        
      - name: Setup Apple Account
        run: |
          echo "=== Setting up Apple Developer Account ==="
          
          # Team IDを設定
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          if [ -z "$TEAM_ID" ]; then
            echo "❌ APPLE_TEAM_ID not set"
            exit 1
          fi
          
          echo "✅ Team ID: ${TEAM_ID}"
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          
      - name: Remove All Manual Signing
        run: |
          echo "=== Removing all manual signing settings ==="
          
          # Find Xcode project
          XCODE_PROJECT=$(find build -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "❌ No Xcode project found"
            exit 1
          fi
          
          PBXPROJ="$XCODE_PROJECT/project.pbxproj"
          
          # 完全にクリーンな状態にする
          cp "$PBXPROJ" "$PBXPROJ.backup"
          
          # すべての手動署名設定を削除
          perl -i -pe 's/ProvisioningStyle = Manual/ProvisioningStyle = Automatic/g' "$PBXPROJ"
          perl -i -pe 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' "$PBXPROJ"
          perl -i -pe 's/CODE_SIGN_STYLE = "Manual"/CODE_SIGN_STYLE = "Automatic"/g' "$PBXPROJ"
          
          # Team IDを設定
          perl -i -pe "s/DEVELOPMENT_TEAM = \".*?\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PBXPROJ"
          perl -i -pe "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PBXPROJ"
          
          # プロビジョニングプロファイルをクリア
          perl -i -pe 's/PROVISIONING_PROFILE_SPECIFIER = ".*?"/PROVISIONING_PROFILE_SPECIFIER = ""/g' "$PBXPROJ"
          perl -i -pe 's/PROVISIONING_PROFILE = ".*?"/PROVISIONING_PROFILE = ""/g' "$PBXPROJ"
          perl -i -pe 's/"PROVISIONING_PROFILE\[sdk=iphoneos\*\]" = ".*?"/"PROVISIONING_PROFILE[sdk=iphoneos*]" = ""/g' "$PBXPROJ"
          
          # 署名IDを自動に
          perl -i -pe 's/CODE_SIGN_IDENTITY = ".*?"/CODE_SIGN_IDENTITY = "Apple Development"/g' "$PBXPROJ"
          perl -i -pe 's/CODE_SIGN_IDENTITY = ""/CODE_SIGN_IDENTITY = "Apple Development"/g' "$PBXPROJ"
          
          echo "Project settings updated"
          
      - name: Build with Xcode Automatic Management
        run: |
          echo "=== Building with automatic signing ==="
          
          XCODE_PROJECT=$(find build -name "*.xcodeproj" -type d | head -n 1)
          
          # プロジェクトの設定を確認
          echo "=== Project settings ==="
          xcodebuild -project "$XCODE_PROJECT" -showBuildSettings | grep -E "(TEAM|SIGN|PROVISION)" | sort | uniq
          
          # ビルド（Apple IDでログインしていることを前提）
          echo "=== Starting build ==="
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/Unity.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Automatic" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -disableAutomaticPackageResolution \
            2>&1 | tee build.log || {
              echo "=== Build failed ==="
              
              # エラーの詳細を表示
              echo "=== Error details ==="
              grep -A5 -B5 -i "error" build.log | tail -100
              
              # 別の方法を試す
              echo "=== Trying xcrun xcodebuild ==="
              xcrun xcodebuild -project "$XCODE_PROJECT" \
                -scheme Unity-iPhone \
                -sdk iphoneos \
                -configuration Release \
                build \
                DEVELOPMENT_TEAM="$TEAM_ID" \
                CODE_SIGNING_ALLOWED=YES \
                CODE_SIGNING_REQUIRED=YES \
                CODE_SIGN_STYLE=Automatic \
                2>&1 | tee build2.log || {
                  echo "Also failed with xcrun"
                  tail -50 build2.log
                }
              
              exit 1
            }
            
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: force-automatic-signing-logs
          path: |
            build.log
            build2.log
            build/iOS/*.xcodeproj/project.pbxproj.backup