name: iOS Simplified Build

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:
  build-ios-simplified:
    name: Simplified iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      # シンプルな証明書セットアップ
      - name: Setup Certificates
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          # 必須項目チェック
          if [ -z "$TEAM_ID" ]; then
            echo "::error::Team ID not set (APPLE_TEAM_ID or IOS_DEVELOPMENT_TEAM)"
            exit 1
          fi
          
          # 証明書セットアップ
          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > cert.p12
            
            # キーチェーンを作成
            security create-keychain -p actions ios-build.keychain-db
            security set-keychain-settings -lut 21600 ios-build.keychain-db
            security unlock-keychain -p actions ios-build.keychain-db
            
            # デフォルトキーチェーンとして設定
            security list-keychains -d user -s ios-build.keychain-db
            security default-keychain -s ios-build.keychain-db
            
            # 証明書をインポート（エラーを無視しない）
            security import cert.p12 -k ios-build.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions ios-build.keychain-db
            
            rm cert.p12
          fi
          
          # プロビジョニングプロファイルセットアップ
          if [ -n "$MOBILEPROVISION_BASE64" ]; then
            echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
            
            # プロファイルをインストール
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
            
            # UUIDを取得して正しい名前でコピー
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i profile.mobileprovision))
            if [ -n "$UUID" ]; then
              cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
            fi
            
            rm profile.mobileprovision
          fi
          
          # 確認
          echo "=== Certificates ==="
          security find-identity -v -p codesigning
          echo ""
          echo "=== Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          
      # Unity Builder
      - name: Build Unity iOS
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          buildsPath: build
          buildName: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          
      # Xcodeビルド（シンプル版）
      - name: Build with Xcode
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          # Xcodeプロジェクトを探す
          XCODE_PROJECT=$(find build -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "::error::Xcode project not found"
            exit 1
          fi
          
          echo "Building: $XCODE_PROJECT"
          
          # プロジェクト設定を確認
          echo "=== Project Info ==="
          xcodebuild -project "$XCODE_PROJECT" -list || true
          
          # ビルド設定を表示
          echo "=== Build Settings ==="
          xcodebuild -project "$XCODE_PROJECT" -showBuildSettings | grep -E "(BUNDLE_IDENTIFIER|TEAM|SIGN)" | head -20 || true
          
          # ビルド実行（自動署名）
          echo "=== Building ==="
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/archive.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=com.yousan \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration || {
              echo "::error::Build failed"
              
              # エラー時の診断情報
              echo "=== Diagnostic Info ==="
              echo "Team ID: $TEAM_ID"
              echo "Certificates available: $(security find-identity -v -p codesigning | grep -c 'valid')"
              echo "Keychain: $(security default-keychain)"
              
              # シミュレータビルドを試す
              echo "=== Trying simulator build ==="
              xcodebuild -project "$XCODE_PROJECT" \
                -scheme Unity-iPhone \
                -sdk iphonesimulator \
                -configuration Release \
                build \
                CODE_SIGNING_REQUIRED=NO || echo "Simulator build also failed"
                
              exit 1
            }
            
      # アーティファクトアップロード
      - name: Upload Build
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-build-result
          path: |
            build/
            *.log