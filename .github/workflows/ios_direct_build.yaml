name: iOS Direct Build Fix

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

jobs:
  direct-ios-build:
    name: Direct iOS Build with Fixes
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Download Unity iOS Build
        uses: actions/download-artifact@v4.1.0
        with:
          name: ios-xcode-project
          path: build/iOS
        continue-on-error: true
        
      - name: Setup Environment
        run: |
          echo "=== Setting up environment ==="
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          
          # Setup keychain
          KEYCHAIN_NAME="build.keychain-db"
          KEYCHAIN_PASSWORD="temp-password-$(date +%s)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_NAME"
          
          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          
      - name: Import Certificate with Debug
        run: |
          echo "=== Importing certificate ==="
          if [ -z "${{ secrets.IOS_P12_BASE64 }}" ]; then
            echo "❌ No certificate to import"
            exit 1
          fi
          
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 --decode > cert.p12
          
          # Import with all permissions
          security import cert.p12 -P "${{ secrets.IOS_P12_PASSWORD }}" \
            -A -t cert -f pkcs12 -k "${{ env.KEYCHAIN_NAME }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
            
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ env.KEYCHAIN_PASSWORD }}" "${{ env.KEYCHAIN_NAME }}"
          
          # Verify
          echo "=== Imported certificates ==="
          security find-identity -v -p codesigning "${{ env.KEYCHAIN_NAME }}"
          
          rm cert.p12
          
      - name: Install Provisioning Profile
        run: |
          echo "=== Installing provisioning profile ==="
          if [ -z "${{ secrets.IOS_MOBILEPROVISION_BASE64 }}" ]; then
            echo "❌ No provisioning profile to install"
            exit 1
          fi
          
          echo "${{ secrets.IOS_MOBILEPROVISION_BASE64 }}" | base64 --decode > profile.mobileprovision
          
          # Get UUID
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i profile.mobileprovision))
          echo "Profile UUID: $UUID"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          
          # Install
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          
          rm profile.mobileprovision
          
      - name: Fix Xcode Project Settings
        run: |
          echo "=== Fixing Xcode project settings ==="
          
          # Find Xcode project
          if [ -d "build/iOS" ]; then
            XCODE_PROJECT=$(find build/iOS -name "*.xcodeproj" -type d | head -n 1)
          else
            echo "Creating test project since Unity build not available"
            mkdir -p build/iOS
            # Create a minimal test project
            # ... (省略)
            XCODE_PROJECT="build/iOS/TestProject.xcodeproj"
          fi
          
          if [ -z "$XCODE_PROJECT" ]; then
            echo "❌ No Xcode project found"
            exit 1
          fi
          
          echo "XCODE_PROJECT=$XCODE_PROJECT" >> $GITHUB_ENV
          
          # Fix project.pbxproj
          PBXPROJ="$XCODE_PROJECT/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            echo "Fixing $PBXPROJ"
            
            # Backup
            cp "$PBXPROJ" "$PBXPROJ.backup"
            
            # Fix settings
            sed -i '' "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"${{ env.TEAM_ID }}\"/g" "$PBXPROJ"
            sed -i '' "s/DEVELOPMENT_TEAM = \".*\"/DEVELOPMENT_TEAM = \"${{ env.TEAM_ID }}\"/g" "$PBXPROJ"
            sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' "$PBXPROJ"
            sed -i '' 's/CODE_SIGN_IDENTITY = ""/CODE_SIGN_IDENTITY = "Apple Development"/g' "$PBXPROJ"
            
            echo "Applied fixes to project file"
          fi
          
      - name: Build with Detailed Logging
        run: |
          echo "=== Building iOS app ==="
          
          cd "$(dirname "${{ env.XCODE_PROJECT }}")"
          
          # Clean first
          xcodebuild clean -project "$(basename "${{ env.XCODE_PROJECT }}")" -scheme Unity-iPhone || true
          
          # List schemes
          echo "=== Available schemes ==="
          xcodebuild -project "$(basename "${{ env.XCODE_PROJECT }}")" -list || true
          
          # Try build with automatic signing
          echo "=== Attempting build ==="
          xcodebuild -project "$(basename "${{ env.XCODE_PROJECT }}")" \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" \
            CODE_SIGN_STYLE="Automatic" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) NDEBUG' \
            ENABLE_BITCODE=NO \
            2>&1 | tee build.log || {
              echo "=== Build failed, checking errors ==="
              
              # Extract specific errors
              echo "=== Code signing errors ==="
              grep -i "code sign" build.log | tail -20 || true
              
              echo "=== Provisioning errors ==="
              grep -i "provision" build.log | tail -20 || true
              
              echo "=== Identity errors ==="
              grep -i "identity" build.log | tail -20 || true
              
              echo "=== Team errors ==="
              grep -i "team" build.log | tail -20 || true
              
              exit 1
            }
            
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            build/iOS/*.log
            build.log