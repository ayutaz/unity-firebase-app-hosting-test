name: Unity Build and Deploy

on:
  push:
    branches: 
      - main
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
      - 'develop'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UNITY_VERSION: '6000.0.43f1'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # Android向けビルドとデプロイジョブ
  build-android:
    name: Build and Deploy Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ディスク容量の確保
      - name: Free disk space
        run: |
          sudo swapoff -a && sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo apt-get remove -y google-cloud-cli || sudo apt-get remove -y google-cloud-sdk
          sudo apt-get autoremove -y && sudo apt-get clean
          docker system prune -af
          df -h
      - name: Clean up Docker space
        run: docker system prune --volumes -a -f

      - name: Cache Unity Library - Android
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
      - name: Build Android App
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildsPath: build
          buildName: MyAndroidApp
          androidExportType: androidPackage
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Build-Android
          path: build/Android/MyAndroidApp.apk

      - name: Deploy to Firebase App Distribution
        if: github.event_name != 'pull_request'
        run: |
          # Google Cloud SDKのインストール
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates gnupg curl
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
            | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg \
            | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update
          sudo apt-get install -y google-cloud-sdk
      # 3) Firebase CLI インストール (standalone)
      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version
      - name: Setup Service Account & Distribute
        run: |
          # 1) JSON を復元
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > service_account.json
          echo "Service Account JSON size: $(stat -c %s service_account.json) bytes"
          
          # 2) 変数をエクスポート (これでこのステップのシェルで認識される)
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service_account.json"
          
          # 3) Firebase CLI を使ってアップロード
          firebase appdistribution:distribute build/Android/MyAndroidApp.apk \
            --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --groups "testers" \
            --release-notes "Release from GitHub Actions" \
  build-webgl:
    name: Build and Deploy WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: webgl-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ディスク容量の確保
      - name: Free disk space
        run: |
          sudo swapoff -a && sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo apt-get remove -y google-cloud-cli || sudo apt-get remove -y google-cloud-sdk
          sudo apt-get autoremove -y && sudo apt-get clean
          docker system prune -af
          df -h
      - name: Clean up Docker space
        run: docker system prune --volumes -a -f

      - name: Cache Unity Library - WebGL
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
      - name: Build WebGL App
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          buildsPath: build
          buildName: WebGL
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Build-WebGL
          path: build/WebGL
          retention-days: 14

      # ブランチ名からチャンネルIDを生成（PRでない場合のみ）
      - name: Generate Channel ID
        if: github.event_name != 'pull_request'
        id: channel
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          CHANNEL_ID=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[_\/]\+/-/g' -e 's/^-*//' -e 's/-*$//' -e 's/--*/-/g')
          CHANNEL_ID=$(echo "$CHANNEL_ID" | tr -cd 'a-z0-9-' | cut -c 1-36)
          if [[ "$BRANCH_NAME" == "main" ]]; then
            CHANNEL_ID="live"
          fi
          if [[ -z "$CHANNEL_ID" || "$CHANNEL_ID" == "-" ]]; then
            CHANNEL_ID="preview-${GITHUB_SHA::7}"
          fi
          echo "Generated Channel ID: $CHANNEL_ID"
          echo "CHANNEL_ID=$CHANNEL_ID" >> $GITHUB_ENV
      # Firebase CLI を使って Hosting にデプロイ（PRでない場合のみ）
      - name: Deploy to Firebase Hosting using CLI
        if: github.event_name != 'pull_request'
        run: |
          # Firebase CLI インストール
          if ! command -v firebase &> /dev/null; then
              echo "Firebase CLI not found, installing..."
              if ! command -v curl &> /dev/null; then sudo apt-get update && sudo apt-get install -y curl; fi
              curl -sL https://firebase.tools | bash
          fi
          firebase --version
          # サービスアカウントキー処理
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > service_account_webgl.json
          JSON_SIZE=$(stat -c %s service_account_webgl.json)
          echo "WebGL Service Account JSON size: $JSON_SIZE bytes"
          if [ "$JSON_SIZE" -lt 100 ]; then
            echo "Error: Failed to create valid WebGL service account file."
            cat service_account_webgl.json
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service_account_webgl.json"
          # --- デプロイコマンド ---
          FIREBASE_PROJECT="${{ env.FIREBASE_PROJECT_ID }}"
          if [ -z "$FIREBASE_PROJECT" ]; then
            echo "Error: FIREBASE_PROJECT_ID env var is not set."
            exit 1
          fi
          DEPLOY_CHANNEL="${{ env.CHANNEL_ID }}"
          # 公開するディレクトリ（ビルド成果物の場所）
          PUBLIC_DIR="build/WebGL/WebGL"
          echo "Creating temporary firebase.json with headers..."
          echo '{
            "hosting": {
              "public": "'"$PUBLIC_DIR"'",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ]
            }
          }' > firebase.json
          echo "Generated firebase.json:"
          cat firebase.json
          
          echo "Deploying to project '$FIREBASE_PROJECT' on channel '$DEPLOY_CHANNEL'"
          # チャンネルに応じたデプロイコマンド (変更なし)
          if [[ "$DEPLOY_CHANNEL" == "live" ]]; then
             echo "Deploying to production (live) channel..."
             firebase deploy \
               --project "$FIREBASE_PROJECT" \
               --only hosting \
               --message "Deploy build ${{ github.run_number }} from commit ${{ github.sha }} (branch: ${GITHUB_REF_NAME})" \
               --force \
               --debug
          else
             echo "Deploying to preview channel: $DEPLOY_CHANNEL"
             firebase hosting:channel:deploy "$DEPLOY_CHANNEL" \
               --project "$FIREBASE_PROJECT" \
               --only hosting \
               --expires 7d \
               --debug
          fi
          echo "Firebase deployment command executed."
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
          CI: true

  # iOS向けビルドとデプロイジョブ
  build-ios:
    name: Build iOS Xcode Project  
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Cache Unity Library - iOS
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            
      # Unity BuilderでiOS向けXcodeプロジェクトを生成（Linuxで実行）
      - name: Build iOS Xcode Project
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          buildsPath: build
          buildName: iOS
          unityVersion: ${{ env.UNITY_VERSION }}

      # Unity Builderの出力を確認
      - name: Check Unity Builder Output
        run: |
          echo "=== Unity Builder Output Structure ==="
          if [ -d "build/iOS" ]; then
            echo "iOS build directory exists"
            find build/iOS -name "*.xcodeproj" -o -name "*.xcworkspace" | head -10
            echo ""
            echo "=== Directory Structure ==="
            ls -la build/iOS/ | head -20
          else
            echo "::error::iOS build directory not found"
            exit 1
          fi
          
      # ビルド成果物をアーティファクトとして保存
      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-xcode-project
          path: build/iOS
          retention-days: 1

  # macOSでXcodeビルドを実行する別ジョブ
  build-ios-xcode:
    name: Build iOS App with Xcode
    needs: build-ios
    runs-on: macos-latest
    if: success()
    timeout-minutes: 30
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.IOS_DEVELOPMENT_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      # 必要なSecretsが設定されているか確認
      - name: Validate Required Secrets
        run: |
          echo "Checking required secrets..."
          MISSING_SECRETS=""
          
          if [ -z "${{ secrets.IOS_P12_BASE64 }}" ]; then
            echo "::error::IOS_P12_BASE64 is not set"
            MISSING_SECRETS="${MISSING_SECRETS} IOS_P12_BASE64"
          fi
          
          if [ -z "${{ secrets.IOS_P12_PASSWORD }}" ]; then
            echo "::error::IOS_P12_PASSWORD is not set"
            MISSING_SECRETS="${MISSING_SECRETS} IOS_P12_PASSWORD"
          fi
          
          if [ -z "${{ secrets.IOS_MOBILEPROVISION_BASE64 }}" ]; then
            echo "::error::IOS_MOBILEPROVISION_BASE64 is not set"
            MISSING_SECRETS="${MISSING_SECRETS} IOS_MOBILEPROVISION_BASE64"
          fi
          
          # Check for either IOS_DEVELOPMENT_TEAM or APPLE_TEAM_ID
          if [ -z "${{ secrets.IOS_DEVELOPMENT_TEAM }}" ] && [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "::error::Neither IOS_DEVELOPMENT_TEAM nor APPLE_TEAM_ID is set"
            echo "This secret is REQUIRED for iOS builds. Please set either IOS_DEVELOPMENT_TEAM or APPLE_TEAM_ID in GitHub repository settings."
            echo "You can find your Team ID at: https://developer.apple.com/account/#/membership/"
            MISSING_SECRETS="${MISSING_SECRETS} IOS_DEVELOPMENT_TEAM/APPLE_TEAM_ID"
          fi
          
          if [ -z "${{ secrets.FIREBASE_IOS_APP_ID }}" ]; then
            echo "::error::FIREBASE_IOS_APP_ID is not set"
            MISSING_SECRETS="${MISSING_SECRETS} FIREBASE_IOS_APP_ID"
          fi
          
          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required secrets:$MISSING_SECRETS"
            echo "Please set these secrets in GitHub repository settings."
            exit 1
          fi
          
          echo "All required secrets are set."

      # Unity Builderで生成したXcodeプロジェクトをダウンロード
      - name: Download Xcode Project
        uses: actions/download-artifact@v4.1.0
        with:
          name: ios-xcode-project
          path: build/iOS
          
      # ダウンロードしたファイルを確認
      - name: Verify Downloaded Files
        run: |
          echo "=== Downloaded Files ==="
          if [ -d "build/iOS" ]; then
            echo "iOS directory exists after download"
            find build/iOS -type f -name "*.xcodeproj" -o -name "*.xcworkspace" | head -10
            echo ""
            echo "Total files: $(find build/iOS -type f | wc -l)"
          else
            echo "::error::Downloaded iOS directory not found"
            exit 1
          fi

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Code Signing Certificates
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "=== Importing certificates manually ==="
          
          # Decode certificate
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          
          # Create temporary keychain
          KEYCHAIN_PATH="$HOME/Library/Keychains/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="temporary-password-$(date +%s)"
          
          # Delete existing keychain if exists
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          
          # Create new keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          
          # Import certificate
          security import certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          
          # Set key partition list
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Make it default
          security default-keychain -s "$KEYCHAIN_PATH"
          
          # Verify import
          echo "=== Imported certificates ==="
          security find-identity -v -p codesigning
          
          # Get certificate name
          CERT_NAME=$(security find-identity -v -p codesigning | grep -E "iPhone (Developer|Distribution)" | head -1 | sed -E 's/^[^"]*"([^"]*)".*$/\1/')
          
          if [ -z "$CERT_NAME" ]; then
            echo "::warning::No iOS certificate found, using generic name"
            CERT_NAME="iPhone Distribution"
          fi
          
          echo "Certificate Name: $CERT_NAME"
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
          
          # Clean up
          rm -f certificate.p12
          
          # Export keychain info
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      # Team IDを取得
      - name: Setup Team ID
        run: |
          TEAM_ID="${{ secrets.IOS_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID }}"
          if [ -z "$TEAM_ID" ]; then
            echo "::error::Neither IOS_DEVELOPMENT_TEAM nor APPLE_TEAM_ID is set"
            exit 1
          fi
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "Using Team ID: $TEAM_ID"

      - name: Install Provisioning Profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "=== Installing provisioning profile ==="
          
          # Create profiles directory
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          
          # Decode profile
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > temp.mobileprovision
          
          # Get UUID
          PROFILE_UUID=$(security cms -D -i temp.mobileprovision | grep -A1 "<key>UUID</key>" | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::Failed to extract provisioning profile UUID"
            exit 1
          fi
          
          echo "Profile UUID: $PROFILE_UUID"
          
          # Install with correct filename
          cp temp.mobileprovision "$PROF_DIR/$PROFILE_UUID.mobileprovision"
          
          # Clean up
          rm -f temp.mobileprovision
          
          echo "Profile installed at: $PROF_DIR/$PROFILE_UUID.mobileprovision"
          ls -la "$PROF_DIR/"

      # プロビジョニングプロファイルのUUIDを取得
      - name: Get Provisioning Profile UUID
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "=== Extracting provisioning profile UUID ==="
          
          # Decode profile
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > temp.mobileprovision
          
          # Extract plist
          security cms -D -i temp.mobileprovision > temp.plist
          
          # Get UUID using PlistBuddy
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" temp.plist 2>/dev/null)
          
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::Failed to extract UUID with PlistBuddy, trying alternative method"
            # Alternative method using grep
            PROFILE_UUID=$(grep -A1 "<key>UUID</key>" temp.plist | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          fi
          
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::Failed to extract provisioning profile UUID"
            cat temp.plist | grep -A5 -B5 "UUID"
            exit 1
          fi
          
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "Profile UUID: $PROFILE_UUID"
          
          # Also get bundle ID for verification
          PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" temp.plist 2>/dev/null || echo "")
          echo "Profile Bundle ID: $PROFILE_BUNDLE_ID"
          
          rm -f temp.mobileprovision temp.plist
          
      # 証明書とプロファイルの確認
      - name: Verify Code Signing Setup
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "=== Available Certificates ==="
          security find-identity -v -p codesigning || echo "No codesigning certificates found"
          echo ""
          echo "=== Available Keychains ==="
          security list-keychains
          echo ""
          echo "=== Installed Provisioning Profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "No profiles directory"
          echo ""
          echo "=== Development Team: ${{ secrets.IOS_DEVELOPMENT_TEAM }} ==="
          echo "=== Code Sign Identity: ${{ secrets.IOS_CODE_SIGN_IDENTITY }} ==="
          echo ""
          # プロビジョニングプロファイルの内容を確認
          if [ -f "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" ]; then
            echo "=== Provisioning Profile Info ==="
            security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" > profile_info.plist
            
            echo "Profile Name: $(/usr/libexec/PlistBuddy -c 'Print :Name' profile_info.plist 2>/dev/null || echo 'Not found')"
            echo "Team ID: $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile_info.plist 2>/dev/null || echo 'Not found')"
            echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile_info.plist 2>/dev/null || echo 'Not found')"
            echo "Profile Type: $(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' profile_info.plist 2>/dev/null && echo 'Ad Hoc/Enterprise' || echo 'Development/App Store')"
            
            # Bundle IDのチェック
            PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile_info.plist 2>/dev/null || echo '')
            if [[ "$PROFILE_BUNDLE_ID" == *"com.yousan"* ]]; then
              echo "✅ Profile bundle ID matches com.yousan"
            else
              echo "❌ Profile bundle ID does NOT match com.yousan"
              echo "Profile is for: $PROFILE_BUNDLE_ID"
              echo "::warning::Bundle ID mismatch - this will cause code signing to fail"
            fi
            
            rm -f profile_info.plist
          fi

      # Team IDの環境変数設定を確認
      - name: Verify Team ID Environment
        run: |
          echo "=== Team ID Verification ==="
          echo "TEAM_ID from env: ${TEAM_ID}"
          echo "TEAM_ID from secrets (direct): ${{ secrets.APPLE_TEAM_ID || secrets.IOS_DEVELOPMENT_TEAM }}"
          if [ -z "${TEAM_ID}" ]; then
            echo "::error::TEAM_ID environment variable is not set"
            exit 1
          fi
          echo "✅ TEAM_ID is available: ${TEAM_ID}"
          
      # ビルド前の環境確認
      - name: Pre-build Environment Check
        run: |
          echo "=== Environment Variables ==="
          echo "DEVELOPMENT_TEAM is set: ${{ secrets.IOS_DEVELOPMENT_TEAM != '' }}"
          echo "CODE_SIGN_IDENTITY is set: ${{ secrets.IOS_CODE_SIGN_IDENTITY != '' }}"
          echo "PROFILE_UUID: ${{ env.PROFILE_UUID }}"
          echo ""
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          echo ""
          echo "=== Xcode Project Location ==="
          XCODE_PROJECT=$(find build/iOS -name "*.xcodeproj" -type d | head -n 1)
          echo "Project: $XCODE_PROJECT"
          
          # Unity-iPhone.xcodeprojのpbxprojファイルを修正
          PBXPROJ="$XCODE_PROJECT/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            echo "Updating project.pbxproj for proper code signing..."
            
            # 現在の設定を確認
            echo "Current CODE_SIGN_IDENTITY settings:"
            grep -n "CODE_SIGN_IDENTITY" "$PBXPROJ" | head -5
            echo "Current DEVELOPMENT_TEAM settings:"
            grep -n "DEVELOPMENT_TEAM" "$PBXPROJ" | head -5
            
            # CODE_SIGN_IDENTITYを設定
            if [ -n "${{ secrets.IOS_CODE_SIGN_IDENTITY }}" ]; then
              sed -i.bak "s/CODE_SIGN_IDENTITY = \".*\"/CODE_SIGN_IDENTITY = \"${{ secrets.IOS_CODE_SIGN_IDENTITY }}\"/g" "$PBXPROJ"
            else
              sed -i.bak 's/CODE_SIGN_IDENTITY = ".*"/CODE_SIGN_IDENTITY = "iPhone Distribution"/g' "$PBXPROJ"
            fi
            
            # DEVELOPMENT_TEAMを設定 (IOS_DEVELOPMENT_TEAM または APPLE_TEAM_ID)
            TEAM_ID="${{ secrets.IOS_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID }}"
            if [ -n "$TEAM_ID" ]; then
              sed -i.bak "s/DEVELOPMENT_TEAM = \".*\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PBXPROJ"
              sed -i.bak "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PBXPROJ"
            fi
            
            # CODE_SIGN_STYLEをAutomaticに設定
            sed -i.bak 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' "$PBXPROJ"
            
            # バックアップファイルを削除
            rm -f "$PBXPROJ.bak"
            
            echo "Updated settings:"
            grep -n "CODE_SIGN_IDENTITY" "$PBXPROJ" | head -5
            grep -n "DEVELOPMENT_TEAM" "$PBXPROJ" | head -5
            echo "Project file updated."
          fi
          
      # Xcodeプロジェクトをビルド
      - name: Build iOS App
        env:
          DEVELOPMENT_TEAM: ${{ env.TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          # エラー出力を詳細に
          set -e
          XCODE_PROJECT=$(find build/iOS -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "::error::Xcode project not found"
            exit 1
          fi
          
          echo "Building Xcode project: $XCODE_PROJECT"
          
          # Xcodeプロジェクトの構成を確認
          echo "=== Available Schemes ==="
          xcodebuild -project "$XCODE_PROJECT" -list
          
          # アーカイブを作成（実機向け）
          echo "Starting xcodebuild archive..."
          echo "Using DEVELOPMENT_TEAM: $DEVELOPMENT_TEAM"
          echo "Using CODE_SIGN_IDENTITY: $CODE_SIGN_IDENTITY"
          echo "Using PROFILE_UUID: ${{ env.PROFILE_UUID }}"
          
          # まずプロジェクト設定を確認
          echo "=== Checking Xcode Project Settings ==="
          xcodebuild -project "$XCODE_PROJECT" -showBuildSettings -configuration Release | grep -E "(PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN)" | head -20
          
          # ビルドターゲットの確認
          echo "=== Available build targets ==="
          xcodebuild -project "$XCODE_PROJECT" -list
          
          # キーチェーンをアンロック
          if [ -n "${{ env.KEYCHAIN_PATH }}" ]; then
            security unlock-keychain -p "${{ env.KEYCHAIN_PASSWORD }}" "${{ env.KEYCHAIN_PATH }}"
          fi
          
          # Team IDを確認
          if [ -z "$TEAM_ID" ]; then
            echo "::error::Team ID is not set"
            exit 1
          fi
          
          # 自動署名を試す
          echo "Trying automatic signing..."
          echo "Using DEVELOPMENT_TEAM: $TEAM_ID"
          echo "Project: $XCODE_PROJECT"
          
          # より詳細なエラー情報を取得
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "${{ github.workspace }}/build/iOS/Unity-iPhone.xcarchive" \
            clean archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.yousan" \
            CODE_SIGN_STYLE="Automatic" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -verbose 2>&1 | tee xcodebuild.log || {
              echo "::error::Automatic signing failed"
              echo "=== Xcodebuild Error Details ==="
              tail -50 xcodebuild.log | grep -E "(error|Error|ERROR|failed|Failed|FAILED)" || true
              echo "=== End Error Details ==="
              echo "Trying manual signing as fallback..."
              
              # 手動署名を試す
              if [ -n "${{ env.PROFILE_UUID }}" ]; then
                echo "Using PROFILE_UUID: ${{ env.PROFILE_UUID }}"
                
                xcodebuild -project "$XCODE_PROJECT" \
                  -scheme Unity-iPhone \
                  -sdk iphoneos \
                  -configuration Release \
                  -archivePath "${{ github.workspace }}/build/iOS/Unity-iPhone.xcarchive" \
                  clean archive \
                  CODE_SIGN_IDENTITY="${{ env.CERT_NAME }}" \
                  PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_UUID }}" \
                  DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
                  CODE_SIGN_STYLE="Manual" \
                  PRODUCT_BUNDLE_IDENTIFIER="com.yousan" 2>&1 | tee xcodebuild-manual.log || {
                    echo "::error::Both automatic and manual signing failed"
                  echo "=== Manual Signing Error Details ==="
                  tail -50 xcodebuild-manual.log | grep -E "(error|Error|ERROR|failed|Failed|FAILED)" || true
                  echo "=== End Manual Error Details ==="
                  echo "Checking xcodebuild error details..."
              
              # シミュレータ向けビルドを試す（証明書不要）
              echo "Trying simulator build without code signing..."
              xcodebuild -project "$XCODE_PROJECT" \
                -scheme Unity-iPhone \
                -sdk iphonesimulator \
                -configuration Release \
                -archivePath "${{ github.workspace }}/build/iOS/Unity-iPhone-Simulator.xcarchive" \
                clean archive \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-simulator.log || {
                  echo "::error::Even simulator build failed. Checking project issues..."
                  echo "=== Simulator Build Error Details ==="
                  tail -50 xcodebuild-simulator.log | grep -E "(error|Error|ERROR|failed|Failed|FAILED)" || true
                  echo "=== End Simulator Error Details ==="
                  echo "Listing project settings..."
                  xcodebuild -project "$XCODE_PROJECT" -showBuildSettings | grep -E "(PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN)"
                  exit 1
                }
                
                echo "::warning::Only simulator build succeeded. Real device build requires proper signing configuration."
                # シミュレータビルドは成功したが、実機ビルドのための設定が必要
                ARCHIVE_PATH="${{ github.workspace }}/build/iOS/Unity-iPhone-Simulator.xcarchive"
                echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV
                echo "BUILD_TYPE=simulator" >> $GITHUB_ENV
              }
            }
          
          # IPAファイルをエクスポート
          echo "Creating ExportOptions.plist..."
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>${CODE_SIGN_IDENTITY}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.yousan</key>
                  <string>${{ env.PROFILE_UUID }}</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          echo "Starting IPA export..."
          # アーカイブパスを動的に決定
          if [ "${{ env.BUILD_TYPE }}" = "simulator" ]; then
            echo "::warning::Skipping IPA export for simulator build"
            echo "Simulator builds cannot be exported as IPA files for distribution"
          else
            xcodebuild -exportArchive \
              -archivePath "${{ github.workspace }}/build/iOS/Unity-iPhone.xcarchive" \
              -exportPath "${{ github.workspace }}/build/iOS" \
              -exportOptionsPlist ExportOptions.plist || {
              echo "::warning::Export with manual signing failed, trying automatic signing..."
              cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <false/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
              xcodebuild -exportArchive \
                -archivePath "${{ github.workspace }}/build/iOS/Unity-iPhone.xcarchive" \
                -exportPath "${{ github.workspace }}/build/iOS" \
                -exportOptionsPlist ExportOptions.plist
            }
          fi

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: ios-build-output
          path: build/iOS/
          retention-days: 3

      # Firebase App Distributionへのデプロイ
      - name: Deploy to Firebase App Distribution
        if: github.event_name != 'pull_request' && success()
        run: |
          # Firebase CLI インストール
          curl -sL https://firebase.tools | bash
          firebase --version
          
          # サービスアカウントキーを復元
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > service_account_ios.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service_account_ios.json"
          
          # IPAファイルを確認
          IPA_FILE=$(find "${{ github.workspace }}/build/iOS" -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::IPA file not found"
            exit 1
          fi
          
          echo "Found IPA file: $IPA_FILE"
          
          # Firebase App Distributionへアップロード
          firebase appdistribution:distribute "$IPA_FILE" \
            --app ${{ secrets.FIREBASE_IOS_APP_ID }} \
            --groups "testers" \
            --release-notes "Release from GitHub Actions - Build #${{ github.run_number }}"