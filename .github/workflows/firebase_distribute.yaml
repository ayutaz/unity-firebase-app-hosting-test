name: Unity Build and Deploy

on:
  push:
    branches: 
      - main
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
      - 'develop'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UNITY_VERSION: '6000.0.43f1'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # Android向けビルドとデプロイジョブ
  build-android:
    name: Build and Deploy Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ディスク容量の確保
      - name: Free disk space
        run: |
          sudo swapoff -a && sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo apt-get remove -y google-cloud-cli || sudo apt-get remove -y google-cloud-sdk
          sudo apt-get autoremove -y && sudo apt-get clean
          docker system prune -af
          df -h
      - name: Clean up Docker space
        run: docker system prune --volumes -a -f

      - name: Cache Unity Library - Android
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
      - name: Build Android App
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildsPath: build
          buildName: MyAndroidApp
          androidExportType: androidPackage
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Build-Android
          path: build/Android/MyAndroidApp.apk

      - name: Deploy to Firebase App Distribution
        if: github.event_name != 'pull_request'
        run: |
          # Google Cloud SDKのインストール
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates gnupg curl
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
            | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg \
            | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update
          sudo apt-get install -y google-cloud-sdk
      # 3) Firebase CLI インストール (standalone)
      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version
      - name: Setup Service Account & Distribute
        run: |
          # 1) JSON を復元
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > service_account.json
          echo "Service Account JSON size: $(stat -c %s service_account.json) bytes"
          
          # 2) 変数をエクスポート (これでこのステップのシェルで認識される)
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service_account.json"
          
          # 3) Firebase CLI を使ってアップロード
          firebase appdistribution:distribute build/Android/MyAndroidApp.apk \
            --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --groups "testers" \
            --release-notes "Release from GitHub Actions" \
  build-webgl:
    name: Build and Deploy WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: webgl-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ディスク容量の確保
      - name: Free disk space
        run: |
          sudo swapoff -a && sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo apt-get remove -y google-cloud-cli || sudo apt-get remove -y google-cloud-sdk
          sudo apt-get autoremove -y && sudo apt-get clean
          docker system prune -af
          df -h
      - name: Clean up Docker space
        run: docker system prune --volumes -a -f

      - name: Cache Unity Library - WebGL
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
      - name: Build WebGL App
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          buildsPath: build
          buildName: WebGL
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Build-WebGL
          path: build/WebGL
          retention-days: 14

      # ブランチ名からチャンネルIDを生成（PRでない場合のみ）
      - name: Generate Channel ID
        if: github.event_name != 'pull_request'
        id: channel
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          CHANNEL_ID=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[_\/]\+/-/g' -e 's/^-*//' -e 's/-*$//' -e 's/--*/-/g')
          CHANNEL_ID=$(echo "$CHANNEL_ID" | tr -cd 'a-z0-9-' | cut -c 1-36)
          if [[ "$BRANCH_NAME" == "main" ]]; then
            CHANNEL_ID="live"
          fi
          if [[ -z "$CHANNEL_ID" || "$CHANNEL_ID" == "-" ]]; then
            CHANNEL_ID="preview-${GITHUB_SHA::7}"
          fi
          echo "Generated Channel ID: $CHANNEL_ID"
          echo "CHANNEL_ID=$CHANNEL_ID" >> $GITHUB_ENV
      # Firebase CLI を使って Hosting にデプロイ（PRでない場合のみ）
      - name: Deploy to Firebase Hosting using CLI
        if: github.event_name != 'pull_request'
        run: |
          # Firebase CLI インストール
          if ! command -v firebase &> /dev/null; then
              echo "Firebase CLI not found, installing..."
              if ! command -v curl &> /dev/null; then sudo apt-get update && sudo apt-get install -y curl; fi
              curl -sL https://firebase.tools | bash
          fi
          firebase --version
          # サービスアカウントキー処理
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > service_account_webgl.json
          JSON_SIZE=$(stat -c %s service_account_webgl.json)
          echo "WebGL Service Account JSON size: $JSON_SIZE bytes"
          if [ "$JSON_SIZE" -lt 100 ]; then
            echo "Error: Failed to create valid WebGL service account file."
            cat service_account_webgl.json
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service_account_webgl.json"
          # --- デプロイコマンド ---
          FIREBASE_PROJECT="${{ env.FIREBASE_PROJECT_ID }}"
          if [ -z "$FIREBASE_PROJECT" ]; then
            echo "Error: FIREBASE_PROJECT_ID env var is not set."
            exit 1
          fi
          DEPLOY_CHANNEL="${{ env.CHANNEL_ID }}"
          # 公開するディレクトリ（ビルド成果物の場所）
          PUBLIC_DIR="build/WebGL/WebGL"
          echo "Creating temporary firebase.json with headers..."
          echo '{
            "hosting": {
              "public": "'"$PUBLIC_DIR"'",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ]
            }
          }' > firebase.json
          echo "Generated firebase.json:"
          cat firebase.json
          
          echo "Deploying to project '$FIREBASE_PROJECT' on channel '$DEPLOY_CHANNEL'"
          # チャンネルに応じたデプロイコマンド (変更なし)
          if [[ "$DEPLOY_CHANNEL" == "live" ]]; then
             echo "Deploying to production (live) channel..."
             firebase deploy \
               --project "$FIREBASE_PROJECT" \
               --only hosting \
               --message "Deploy build ${{ github.run_number }} from commit ${{ github.sha }} (branch: ${GITHUB_REF_NAME})" \
               --force \
               --debug
          else
             echo "Deploying to preview channel: $DEPLOY_CHANNEL"
             firebase hosting:channel:deploy "$DEPLOY_CHANNEL" \
               --project "$FIREBASE_PROJECT" \
               --only hosting \
               --expires 7d \
               --debug
          fi
          echo "Firebase deployment command executed."
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
          CI: true

  # iOS向けビルドとデプロイジョブ
  build-ios:
    name: Build and Deploy iOS
    runs-on: ubuntu-latest  # macOSではなくLinuxでビルド
    timeout-minutes: 30
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Cache Unity Library - iOS
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            
      # Unity BuilderでiOS向けXcodeプロジェクトを生成（Linuxで実行）
      - name: Build iOS Xcode Project
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          buildsPath: build
          buildName: iOS
          unityVersion: ${{ env.UNITY_VERSION }}

      # ビルド成果物をアーティファクトとして保存
      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-xcode-project
          path: build/iOS
          retention-days: 1

  # macOSでXcodeビルドを実行する別ジョブ
  build-ios-xcode:
    name: Build iOS App with Xcode
    needs: build-ios
    runs-on: macos-latest
    if: success()
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Unity Builderで生成したXcodeプロジェクトをダウンロード
      - name: Download Xcode Project
        uses: actions/download-artifact@v4.1.0
        with:
          name: ios-xcode-project
          path: build/iOS

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          keychain-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          echo "$MOBILEPROVISION_BASE64" | base64 -D > "$PROF_DIR/profile.mobileprovision"

      # プロビジョニングプロファイルのUUIDを取得
      - name: Get Provisioning Profile UUID
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "$MOBILEPROVISION_BASE64" | base64 -D > temp.mobileprovision
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i temp.mobileprovision))
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          rm temp.mobileprovision

      # Xcodeプロジェクトをビルド
      - name: Build iOS App
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          XCODE_PROJECT=$(find build/iOS -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "::error::Xcode project not found"
            exit 1
          fi
          
          echo "Building Xcode project: $XCODE_PROJECT"
          
          # アーカイブを作成（実機向け）
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "${{ github.workspace }}/build/iOS/Unity-iPhone.xcarchive" \
            clean archive \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_UUID }}" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual
          
          # IPAファイルをエクスポート
          echo "Creating ExportOptions.plist..."
          cat > ExportOptions.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>ad-hoc</string>
    <key>teamID</key>
    <string>$DEVELOPMENT_TEAM</string>
    <key>uploadBitcode</key>
    <false/>
    <key>compileBitcode</key>
    <false/>
    <key>uploadSymbols</key>
    <false/>
    <key>signingStyle</key>
    <string>manual</string>
    <key>signingCertificate</key>
    <string>$CODE_SIGN_IDENTITY</string>
    <key>provisioningProfiles</key>
    <dict>
        <key>com.yousan</key>
        <string>${{ env.PROFILE_UUID }}</string>
    </dict>
</dict>
</plist>
EOF
          
          xcodebuild -exportArchive \
            -archivePath "${{ github.workspace }}/build/iOS/Unity-iPhone.xcarchive" \
            -exportPath "${{ github.workspace }}/build/iOS" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: ios-build-output
          path: build/iOS/
          retention-days: 3

      # Firebase App Distributionへのデプロイ
      - name: Deploy to Firebase App Distribution
        if: github.event_name != 'pull_request' && success()
        run: |
          # Firebase CLI インストール
          curl -sL https://firebase.tools | bash
          firebase --version
          
          # サービスアカウントキーを復元
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > service_account_ios.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service_account_ios.json"
          
          # IPAファイルを確認
          IPA_FILE=$(find "${{ github.workspace }}/build/iOS" -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::IPA file not found"
            exit 1
          fi
          
          echo "Found IPA file: $IPA_FILE"
          
          # Firebase App Distributionへアップロード
          firebase appdistribution:distribute "$IPA_FILE" \
            --app ${{ secrets.FIREBASE_IOS_APP_ID }} \
            --groups "testers" \
            --release-notes "Release from GitHub Actions - Build #${{ github.run_number }}"