name: iOS Dev Certificate Build

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:
  ios-dev-cert:
    name: iOS with Dev Certificate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Create Development Certificate
        run: |
          echo "=== Creating temporary development certificate ==="
          
          # Create a self-signed certificate for development
          cat > cert.conf << EOF
          [ req ]
          default_bits = 2048
          prompt = no
          default_md = sha256
          distinguished_name = dn
          
          [ dn ]
          C=US
          ST=CA
          L=San Francisco
          O=Development
          OU=iOS Development
          CN=iPhone Developer
          EOF
          
          # Generate private key
          openssl genrsa -out dev.key 2048
          
          # Generate certificate
          openssl req -new -x509 -key dev.key -out dev.crt -days 365 -config cert.conf
          
          # Create PKCS12
          openssl pkcs12 -export -out dev.p12 -inkey dev.key -in dev.crt -passout pass:development
          
          # Import to keychain
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import dev.p12 -k build.keychain -P development -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          
          # Clean up
          rm dev.key dev.crt dev.p12 cert.conf
          
          echo "✅ Development certificate created"
          
      - name: Create Provisioning Profile
        run: |
          echo "=== Creating development provisioning profile ==="
          
          # Create a minimal provisioning profile
          cat > profile.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Name</key>
              <string>iOS Development Profile</string>
              <key>UUID</key>
              <string>12345678-1234-1234-1234-123456789012</string>
              <key>TeamIdentifier</key>
              <array>
                  <string>${{ secrets.APPLE_TEAM_ID || 'TEMP12345' }}</string>
              </array>
              <key>Entitlements</key>
              <dict>
                  <key>application-identifier</key>
                  <string>${{ secrets.APPLE_TEAM_ID || 'TEMP12345' }}.com.yousan</string>
                  <key>get-task-allow</key>
                  <true/>
              </dict>
              <key>DeveloperCertificates</key>
              <array/>
          </dict>
          </plist>
          EOF
          
          # Convert to binary format
          plutil -convert binary1 -o profile.mobileprovision profile.plist
          
          # Install
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/12345678-1234-1234-1234-123456789012.mobileprovision
          
          echo "✅ Provisioning profile created"
          
      - name: Cache Unity Library
        uses: actions/cache@v4.2.0
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          
      - name: Build Unity iOS
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          buildsPath: build
          buildName: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          
      - name: Build iOS with Dev Certificate
        run: |
          echo "=== Building with development certificate ==="
          
          PROJECT=$(find build -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then
            echo "No project found"
            exit 1
          fi
          
          # Update project settings
          PBXPROJ="$PROJECT/project.pbxproj"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || 'TEMP12345' }}"
          
          sed -i '' "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' "$PBXPROJ"
          
          # Build
          xcodebuild -project "$PROJECT" \
            -scheme Unity-iPhone \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            build \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="12345678-1234-1234-1234-123456789012" || {
              echo "Real device build failed, trying simulator"
              
              xcodebuild -project "$PROJECT" \
                -scheme Unity-iPhone \
                -sdk iphonesimulator \
                -configuration Debug \
                build \
                CODE_SIGNING_ALLOWED=NO
            }
            
      - name: Create and Upload IPA
        if: always()
        run: |
          # Find app bundle
          APP=$(find DerivedData -name "*.app" -type d | head -1)
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r app.ipa Payload
            echo "✅ IPA created"
          else
            echo "No app bundle found"
          fi
          
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-dev-cert-ipa
          path: |
            app.ipa
            DerivedData/