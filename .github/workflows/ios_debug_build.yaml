name: iOS Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ fix/ios-build-workflow ]

env:
  UNITY_VERSION: '6000.0.43f1'

jobs:
  debug-ios-build:
    name: Debug iOS Build Issues
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      # Step 1: 環境確認
      - name: Check Environment
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo ""
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          
      # Step 2: Secrets確認（値は表示しない）
      - name: Check Secrets Status
        run: |
          echo "=== Checking Secrets ==="
          echo "IOS_P12_BASE64: $([ -n '${{ secrets.IOS_P12_BASE64 }}' ] && echo 'SET' || echo 'NOT SET')"
          echo "IOS_P12_PASSWORD: $([ -n '${{ secrets.IOS_P12_PASSWORD }}' ] && echo 'SET' || echo 'NOT SET')"
          echo "IOS_MOBILEPROVISION_BASE64: $([ -n '${{ secrets.IOS_MOBILEPROVISION_BASE64 }}' ] && echo 'SET' || echo 'NOT SET')"
          echo "IOS_DEVELOPMENT_TEAM: $([ -n '${{ secrets.IOS_DEVELOPMENT_TEAM }}' ] && echo 'SET' || echo 'NOT SET')"
          echo "APPLE_TEAM_ID: $([ -n '${{ secrets.APPLE_TEAM_ID }}' ] && echo 'SET' || echo 'NOT SET')"
          echo "IOS_CODE_SIGN_IDENTITY: $([ -n '${{ secrets.IOS_CODE_SIGN_IDENTITY }}' ] && echo 'SET' || echo 'NOT SET')"
          
      # Step 3: 証明書インポート（エラー詳細表示）
      - name: Import Certificate with Debug
        if: ${{ secrets.IOS_P12_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "=== Importing Certificate ==="
          
          # Decode certificate
          echo "$P12_BASE64" | base64 --decode > cert.p12
          
          # Check file size
          FILE_SIZE=$(stat -f%z cert.p12)
          echo "Certificate file size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::Certificate file too small, base64 decoding may have failed"
            exit 1
          fi
          
          # Create keychain
          security create-keychain -p temp test.keychain
          security default-keychain -s test.keychain
          security unlock-keychain -p temp test.keychain
          security set-keychain-settings -lut 21600 test.keychain
          
          # Import with error details
          security import cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k test.keychain 2>&1 || {
            echo "::error::Failed to import certificate"
            echo "Common causes:"
            echo "1. Wrong password"
            echo "2. Corrupted certificate file"
            echo "3. Certificate not in PKCS12 format"
            exit 1
          }
          
          # Check what was imported
          echo "=== Imported Certificates ==="
          security find-identity -v -p codesigning test.keychain
          
          rm cert.p12
          
      # Step 4: プロビジョニングプロファイル検証
      - name: Validate Provisioning Profile
        if: ${{ secrets.IOS_MOBILEPROVISION_BASE64 != '' }}
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          echo "=== Validating Provisioning Profile ==="
          
          # Decode profile
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
          
          # Check file size
          FILE_SIZE=$(stat -f%z profile.mobileprovision)
          echo "Profile file size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::Profile file too small, base64 decoding may have failed"
            exit 1
          fi
          
          # Extract and check details
          security cms -D -i profile.mobileprovision > profile.plist 2>&1 || {
            echo "::error::Failed to decode provisioning profile"
            exit 1
          }
          
          echo "=== Profile Details ==="
          echo "Name: $(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist 2>/dev/null || echo 'ERROR')"
          echo "UUID: $(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist 2>/dev/null || echo 'ERROR')"
          echo "Team ID: $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist 2>/dev/null || echo 'ERROR')"
          echo "App ID: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist 2>/dev/null || echo 'ERROR')"
          echo "Platform: $(/usr/libexec/PlistBuddy -c 'Print :Platform:0' profile.plist 2>/dev/null || echo 'iOS')"
          
          # Check expiration
          EXPIRY=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' profile.plist 2>/dev/null || echo 'ERROR')
          echo "Expiration: $EXPIRY"
          
          # Check if expired
          if [ "$EXPIRY" != "ERROR" ]; then
            EXPIRY_EPOCH=$(date -j -f "%a %b %d %T %Z %Y" "$EXPIRY" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date +%s)
            if [ "$EXPIRY_EPOCH" -lt "$NOW_EPOCH" ]; then
              echo "::error::Provisioning profile has expired!"
            else
              echo "✅ Profile is valid"
            fi
          fi
          
          # Check bundle ID match
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist 2>/dev/null || echo '')
          if [[ "$APP_ID" == *"com.yousan"* ]] || [[ "$APP_ID" == *"*"* ]]; then
            echo "✅ Bundle ID matches or uses wildcard"
          else
            echo "::error::Bundle ID mismatch! Expected: com.yousan, Got: $APP_ID"
          fi
          
          # Check team ID match
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist 2>/dev/null || echo '')
          if [ "$PROFILE_TEAM" = "$TEAM_ID" ]; then
            echo "✅ Team ID matches"
          else
            echo "::warning::Team ID mismatch! Profile: $PROFILE_TEAM, Expected: $TEAM_ID"
          fi
          
          rm -f profile.mobileprovision profile.plist
          
      # Step 5: Unity Builderの出力を確認
      - name: Download Unity Build Output
        uses: actions/download-artifact@v4.1.0
        with:
          name: ios-xcode-project
          path: build/iOS
        continue-on-error: true
        
      # Step 6: Xcodeプロジェクト診断
      - name: Diagnose Xcode Project
        if: success()
        run: |
          XCODE_PROJECT=$(find build/iOS -name "*.xcodeproj" -type d | head -n 1)
          
          if [ -z "$XCODE_PROJECT" ]; then
            echo "::warning::No Xcode project found"
            exit 0
          fi
          
          echo "=== Xcode Project: $XCODE_PROJECT ==="
          
          # List available schemes
          echo "=== Available Schemes ==="
          xcodebuild -project "$XCODE_PROJECT" -list
          
          # Check build settings
          echo "=== Key Build Settings ==="
          xcodebuild -project "$XCODE_PROJECT" -showBuildSettings | grep -E "(PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN|PROVISIONING)" | sort | uniq
          
      # Step 7: 最小限のテストビルド
      - name: Test Minimal Build
        run: |
          echo "=== Creating minimal test project ==="
          
          mkdir -p TestApp
          cd TestApp
          
          # Create minimal Info.plist
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.yousan</string>
              <key>CFBundleName</key>
              <string>TestApp</string>
              <key>CFBundleVersion</key>
              <string>1</string>
          </dict>
          </plist>
          EOF
          
          # Create minimal app
          echo "int main() { return 0; }" > main.c
          
          # Try to build without signing
          echo "=== Build without signing ==="
          clang -target arm64-apple-ios12.0 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) main.c -o TestApp || echo "Build failed"
          
          # Try to sign if certificate available
          if security find-identity -v -p codesigning | grep -q "iPhone"; then
            echo "=== Attempting to sign ==="
            CERT=$(security find-identity -v -p codesigning | grep "iPhone" | head -1 | awk '{print $2}')
            codesign -s "$CERT" -f TestApp || echo "Signing failed"
          fi
          
      # Step 8: Summary
      - name: Summary and Recommendations
        if: always()
        run: |
          echo "=== Debug Summary ==="
          echo ""
          echo "1. Certificate Status:"
          security find-identity -v -p codesigning | grep -c "iPhone" || echo "0 certificates found"
          echo ""
          echo "2. Common Issues to Check:"
          echo "   - Certificate password is correct"
          echo "   - Provisioning profile is not expired"
          echo "   - Bundle ID matches (com.yousan)"
          echo "   - Team ID matches between profile and secrets"
          echo "   - Certificate is included in provisioning profile"
          echo ""
          echo "3. Next Steps:"
          echo "   - Check the error messages above"
          echo "   - Ensure all secrets are properly base64 encoded"
          echo "   - Verify certificate and profile are from same team"